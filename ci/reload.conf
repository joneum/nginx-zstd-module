# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

RELOAD_HTTP=

RELOAD_SERVER='
        location /probe {
            zstd on;
            zstd_types text/plain;
            zstd_min_length 1;
            default_type text/plain;
            return 200 "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa";
        }'

RELOAD_EXPECT=zstd

# What is asked is not "did the server answer" but "did the filter engage":
# the Content-Encoding header is only there when this module compressed the
# body.  A module whose per-cycle state did not survive the reload answers
# 200 with the plain text and would otherwise look healthy.
reload_probe() {
	curl -s --max-time 5 -o /dev/null -D - \
		-H 'Accept-Encoding: zstd' \
		"http://127.0.0.1:$PORT/probe" |
		tr -d '\r' |
		sed -n 's/^[Cc]ontent-[Ee]ncoding: //p'
}
