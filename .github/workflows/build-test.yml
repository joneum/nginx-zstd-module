name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A matrix is read before any step of its own job runs, so the release
    # list has to arrive from an earlier job.  Which releases, and why,
    # is written down in .github/versions.env.
    outputs:
      nginx: ${{ steps.read.outputs.nginx }}
      version: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - id: read
        run: .github/scripts/pins.sh >> "$GITHUB_OUTPUT"

  suite:
    name: nginx ${{ matrix.nginx }}
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        nginx: ${{ fromJSON(needs.pins.outputs.nginx) }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          packages: libzstd-dev

      - name: Build nginx ${{ matrix.nginx }}
        run: ci/build.sh '${{ matrix.nginx }}' "$HOME/nginx"

      - name: Run the test suite
        run: TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

  dynamic:
    name: loadable modules
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          packages: libzstd-dev

      - name: Build both modules as loadable objects
        run: ci/build.sh '${{ needs.pins.outputs.version }}' "$HOME/nginx" dynamic

      - name: Run the test suite against the loaded modules
        run: |
          mods=
          for so in "$HOME"/nginx/modules/*.so; do
            mods="$mods $so"
          done
          echo "loading:$mods"
          TEST_NGINX_LOAD_MODULES="$mods" \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

  no-libzstd-on-static:
    name: the static module carries no libzstd
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ngx_http_zstd_static_module never calls into libzstd.  If a change
    # ever makes it do so, the dependency has to be declared, and this
    # job is where that shows up.

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          packages: libzstd-dev
          test-nginx: 'false'

      - name: Build both modules as loadable objects
        run: ci/build.sh '${{ needs.pins.outputs.version }}' "$HOME/nginx" dynamic

      - name: ngx_http_zstd_static_module.so must not need libzstd
        run: |
          so="$HOME/nginx/modules/ngx_http_zstd_static_module.so"
          if ldd "$so" | grep -q libzstd; then
            ldd "$so"
            echo "the static module links libzstd, see above" >&2
            exit 1
          fi
          echo "no libzstd on the static module"
